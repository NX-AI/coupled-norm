
# Config for single device knowledge distillation (KD) in knowledge_distillation_single_device.py
# using a LLAMA3 teacher and student model

defaults:
  - dataset: nemotron-stem

hydra:
  run:
    dir: "/nfs-gpu/users_home/martin/couplednorm-output/outputs/${oc.env:SLURM_JOB_ID, local_run}"

name: coupled
run_id: "${name}-${oc.env:SLURM_JOB_ID, local_run}"

output_dir: ${hydra:runtime.output_dir}

# Model Arguments
model:
  _component_: components.models.lora_llama3_2_1b 
  norm_normal_before: 3
  norm_normal_after: 100
  # We only add lora to the MLP's
  lora_attn_modules: [] # ['q_proj', 'v_proj', 'output_proj']
  apply_lora_to_mlp: True
  apply_lora_to_output: False
  lora_rank: 1024  # higher increases accuracy and memory
  lora_alpha: 2048  # usually alpha=2*rank
  lora_dropout: 0.0
  use_dora: True
  coupled_init_downscale: 0.91

teacher_model:
  _component_: torchtune.models.llama3_2.llama3_2_1b

tokenizer:
  _component_: torchtune.models.llama3.llama3_tokenizer
  path: /nfs-gpu/users_home/martin/couplednorm-output/model/Llama-3.2-1B-Instruct/original/tokenizer.model
  max_seq_len: 2048

checkpointer:
  _component_: torchtune.training.FullModelHFCheckpointer
  checkpoint_dir: /nfs-gpu/users_home/martin/couplednorm-output/model/Llama-3.2-1B-Instruct/
  checkpoint_files: [
    model.safetensors
  ]
  recipe_checkpoint: null
  output_dir: ${hydra:runtime.output_dir}
  model_type: LLAMA3
resume_from_checkpoint: False
save_adapter_weights_only: False

teacher_checkpointer:
  _component_: torchtune.training.FullModelHFCheckpointer
  checkpoint_dir: /nfs-gpu/users_home/martin/couplednorm-output/model/Llama-3.2-1B-Instruct/
  checkpoint_files: [
    model.safetensors
  ]
  recipe_checkpoint: null
  output_dir: ${hydra:runtime.output_dir}
  model_type: LLAMA3

optimizer:
  _component_: torch.optim.AdamW
  fused: True
  weight_decay: 0.0 # 0.01
  lr: 1e-5
lr_scheduler:
  _component_: torchtune.training.lr_schedulers.get_cosine_schedule_with_warmup
  num_warmup_steps: 250

loss:
  _component_: components.loss.CELoss

kd_loss:
  _component_: components.loss.ForwardKLLoss

kd_ratio: 1.0

seed: 67
shuffle: True
batch_size: 4

epochs: 1
max_steps_per_epoch: null
gradient_accumulation_steps: 8  # Use to increase effective batch size
clip_grad_norm: 1.0
compile: True  # torch.compile the model + loss, True increases speed + decreases memory

metric_logger:
  _component_: torchtune.training.metric_logging.WandBLogger
  project: coupled-rms-torchtune
  log_dir: ${hydra:runtime.output_dir}/logs
  name: ${run_id}

eval:
  tasks:
    train: ["hellaswag", "mmlu"]
    end: ["hellaswag", "mmlu", "arc_challenge", "gpqa_main_zeroshot"]
  limit: null
  batch_size: 8
  enable_kv_cache: True
  seed: 1234

eval_baseline_only: False

log_every_n_steps: 1
log_peak_memory_stats: True
eval_every_n_steps: 2000


device: cuda
dtype: bf16

enable_activation_checkpointing: False  # True reduces memory
enable_activation_offloading: False  # True reduces memory
