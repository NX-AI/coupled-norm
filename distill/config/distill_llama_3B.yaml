
# Config for single device knowledge distillation (KD) in knowledge_distillation_single_device.py
# using a LLAMA3 teacher and student model

defaults:
  - distill_llama_1B
  - _self_

model:
  _component_: components.models.lora_llama3_2_3b
  norm_normal_before: 0
  norm_normal_after: 100
  coupled_init_downscale: 0.9174312 # alpha = 1.09

teacher_model:
  _component_: torchtune.models.llama3_2.llama3_2_3b

tokenizer:
  path: /nfs-gpu/users_home/martin/couplednorm-output/model/Llama-3.2-3B-Instruct/original/tokenizer.model

checkpointer:
  checkpoint_dir: /nfs-gpu/users_home/martin/couplednorm-output/model/Llama-3.2-3B-Instruct/
  checkpoint_files: [model-00001-of-00002.safetensors, model-00002-of-00002.safetensors]

teacher_checkpointer:
  checkpoint_dir: /nfs-gpu/users_home/martin/couplednorm-output/model/Llama-3.2-3B-Instruct/
  checkpoint_files: [model-00001-of-00002.safetensors, model-00002-of-00002.safetensors]

optimizer:
  lr: 1e-5

eval:
  batch_size: 4

batch_size: 2
gradient_accumulation_steps: 16

enable_activation_checkpointing: True
