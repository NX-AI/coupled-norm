
# Config for single device knowledge distillation (KD) in knowledge_distillation_single_device.py
# using a LLAMA3 teacher and student model

defaults:
  - distill_llama_1B
  - _self_

model:
  _component_: components.models.lora_qwen3_1_7b_instruct
  norm_normal_before: 6 # 1/4 of 28 layers
  norm_normal_after: 100
  coupled_init_downscale: 0.92

teacher_model:
  _component_: torchtune.models.qwen3.qwen3_1_7b_instruct

tokenizer:
  _component_: torchtune.models.qwen3.qwen3_tokenizer
  path: /nfs-gpu/users_home/martin/couplednorm-output/model/Qwen/Qwen3-1.7B/vocab.json
  merges_file: /nfs-gpu/users_home/martin/couplednorm-output/model/Qwen/Qwen3-1.7B/merges.txt
  max_seq_len: 2048

checkpointer:
  checkpoint_dir: /nfs-gpu/users_home/martin/couplednorm-output/model/Qwen/Qwen3-1.7B/
  checkpoint_files: [model-00001-of-00002.safetensors, model-00002-of-00002.safetensors]
  model_type: QWEN3

teacher_checkpointer:
  checkpoint_dir: /nfs-gpu/users_home/martin/couplednorm-output/model/Qwen/Qwen3-1.7B/
  checkpoint_files: [model-00001-of-00002.safetensors, model-00002-of-00002.safetensors]
  model_type: QWEN3

optimizer:
  lr: 1e-5

batch_size: 4

enable_activation_checkpointing: True
enable_activation_offloading: False
